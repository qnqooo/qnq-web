name: QnQ public site quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static site and product truth
        run: node tools/validate-site.mjs
      - name: Validate operational roadmap and guardrails
        run: node tools/validate-roadmap.mjs
      - name: Run tests
        run: node --test tests/*.test.mjs
