name: Curso 067 - revisión diaria
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/course067/**'
      - '.github/workflows/course067-daily.yml'
permissions:
  contents: read
concurrency:
  group: course067-daily
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar regla de reciprocidad
        run: node --test tools/course067/*.test.mjs
      - name: Revisar calendario privado
        env:
          COURSE067_CALENDAR_JSON: ${{ secrets.COURSE067_CALENDAR_JSON }}
        run: node tools/course067/daily.mjs
